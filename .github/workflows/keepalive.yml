# Keeps the free Supabase project from pausing while nobody is using DxDrill.
# It makes one tiny read request every day. Uses only the public (publishable) key.
name: Keep Supabase awake

on:
  schedule:
    - cron: "17 5 * * *"      # every day at 05:17 UTC
  workflow_dispatch:           # lets you press "Run workflow" to test it

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read one row from the database
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://dkullruinrnwjmhlxlpl.supabase.co/rest/v1/classes?select=id&limit=1" \
            -H "apikey: sb_publishable_azxnKz5UEbn3yuZjyqTZWQ_oYaOs92Z")
          echo "Supabase answered with HTTP $code"
          test "$code" = "200"
