name: Visual intake validator
on:
  pull_request:
    paths:
      - "tools/validate-visual-intake.js"
      - "tests/visual-intake-validator.test.js"
      - "tools/import-visual-intake.js"
      - "tests/visual-intake-importer.test.js"
      - "tests/spotter-stations.test.js"
      - "tests/visual-checker.test.js"
      - "visual-checker.html"
      - "checker.html"
      - "js/spotter.js"
      - ".github/workflows/visual-intake-validator.yml"
      - "data/manifest.json"
      - "data/visual-*.json"
      - "data/questions/visual-*.json"
      - "data/img/**"
  push:
    branches: [main]
    paths:
      - "tools/validate-visual-intake.js"
      - "tests/visual-intake-validator.test.js"
      - ".github/workflows/visual-intake-validator.yml"
      - "data/manifest.json"
      - "data/visual-*.json"
      - "data/questions/visual-*.json"
      - "data/img/**"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python -m pip install -r requirements-visual-validation.txt
      - run: node --test tests/visual-intake-validator.test.js tests/visual-intake-importer.test.js tests/spotter-stations.test.js tests/visual-checker.test.js
