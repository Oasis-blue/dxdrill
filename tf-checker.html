<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DxDrill True/False checker</title><link rel="stylesheet" href="css/style.css"><style>
textarea{width:100%;min-height:260px;font:13px/1.45 ui-monospace,monospace;padding:12px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--fg)}.msg{margin:4px 0;padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);overflow-wrap:anywhere}.err{border-color:var(--bad);color:var(--bad)}.warn{border-color:var(--warn);color:var(--warn)}.ok{border-color:var(--good);color:var(--good)}.pv{border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0}
</style></head><body><main class="gutter"><div class="wrap stack" style="padding:24px 0 48px"><header><p class="eyebrow">DxDrill tools</p><h1>True/False checker</h1><p class="lede">Paste AI-generated stems. This checks structure, topics, answer types, explanations, references and duplicates, then downloads an updated True/False bank file.</p></header><section class="section stack"><div class="field"><label class="label" for="inp">Paste the AI's JSON here</label><textarea id="inp" spellcheck="false" placeholder='{ "topic": "pas-central-nervous-system", "questions": [ ... ] }'></textarea></div><div class="row tight"><button class="btn primary" id="go">Check it</button><a class="btn ghost" href="checker.html">Normal question checker</a><a class="btn ghost" href="index.html">Back to DxDrill</a></div></section><section id="out" class="stack" aria-live="polite"></section></div></main>
<script>
(function(){
var $=function(x){return document.getElementById(x)},E={topics:{},existing:[],core:[],ids:{},stems:{}};
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function get(u){return fetch(u).then(function(r){if(!r.ok)throw Error(u+" ("+r.status+")");return r.json()})}
function norm(s){return String(s||"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim()}
var ready=Promise.all([get("data/curriculum.json"),get("data/manifest.json")]).then(function(a){
a[0].subjects.forEach(function(s){s.areas.forEach(function(ar){ar.topics.forEach(function(t){E.topics[t.id]=t.name})})});
return Promise.all((a[1].questions||[]).filter(function(f){return f.indexOf("tf-")===0}).map(function(f){return get("data/questions/"+f+".json").then(function(d){if(f==="tf-core-expansion")E.core=d.questions||[];(d.questions||[]).forEach(function(q){E.existing.push(q);E.ids[q.id]=1;E.stems[norm(q.q)]=1})}).catch(function(e){console.warn(e)})}))
});
function parse(s){var t=s.trim().replace(/^```[a-z]*\s*/i,"").replace(/```\s*$/i,""),a=t.indexOf("{"),b=t.lastIndexOf("}");if(a<0||b<0)throw Error("Paste one complete JSON object.");t=t.slice(a,b+1).replace(/[“”]/g,'"').replace(/[‘’]/g,"'").replace(/,\s*([}\]])/g,"$1");return JSON.parse(t)}
function check(o){
var errors=[],warnings=[],out=[],raw=Array.isArray(o.questions)?o.questions:(o.id?[o]:[]);
if(!raw.length)errors.push("No questions array found.");
raw.forEach(function(q,i){
var tag="Stem "+(i+1),bad=false;function er(s){errors.push(tag+": "+s);bad=true}
var topic=String(q.topic||o.topic||"").trim(),title=String(q.q||"").replace(/\s+/g," ").trim(),sub=String(q.sub||"").replace(/\s+/g," ").trim();
if(!E.topics[topic])er("unknown or missing topic ID: "+topic);if(!title)er("missing stem text (q).");if(!sub)er("missing section label (sub).");if([1,2,3].indexOf(q.level)<0)er("level must be 1, 2 or 3.");
var items=Array.isArray(q.items)?q.items:[];if(items.length<4||items.length>5)er("must have 4 or 5 statements.");
var seen={};items.forEach(function(x,j){var t=String(x&&x.text||"").replace(/\s+/g," ").trim(),ex=String(x&&x.explain||"").replace(/\s+/g," ").trim();if(!t)er("statement "+(j+1)+" has no text.");if(typeof(x&&x.answer)!=="boolean")er("statement "+(j+1)+" answer must be JSON true or false.");if(!ex)er("statement "+(j+1)+" has no explanation.");if(seen[norm(t)])er("statement "+(j+1)+" duplicates another in this stem.");seen[norm(t)]=1});
if(items.length&&items.every(function(x){return x.answer===items[0].answer}))warnings.push(tag+": all answers have the same value; a mixed key is recommended.");
var refs=Array.isArray(q.references)?q.references:[];if(!refs.length)er("add at least one HTTPS source URL in references.");refs.forEach(function(u,j){if(typeof u!=="string"||!/^https:\/\//i.test(u.trim()))er("reference "+(j+1)+" must be an HTTPS URL.")});
if(q.verified===true||q.reviewStatus==="verified")warnings.push(tag+": imported stem will be reset to unverified.");
if(!bad)out.push({id:"",type:"tf",topic:topic,level:q.level,sub:sub,q:title,items:items.map(function(x){return{text:String(x.text).replace(/\s+/g," ").trim(),answer:x.answer,explain:String(x.explain).replace(/\s+/g," ").trim()}}),verified:false,reviewStatus:"draft-unverified",references:refs.map(function(u){return u.trim()})})
});
var local={};out.forEach(function(q,i){var k=norm(q.q);if(E.stems[k]||local[k])errors.push("Stem "+(i+1)+": duplicate stem wording found.");local[k]=1});
return{errors:errors,warnings:warnings,out:out}
}
function download(name,text){var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type:"application/json"}));a.download=name;a.click();setTimeout(function(){URL.revokeObjectURL(a.href)},500)}
function show(r){
var h="";if(r.errors.length)h+="<h2>Fix these first</h2>"+r.errors.map(function(x){return'<div class="msg err">'+esc(x)+'</div>'}).join("")+'<p class="hint">Send these errors to the AI and ask it to correct and resend the full JSON.</p>';
if(r.warnings.length)h+="<h2>Review these</h2>"+r.warnings.map(function(x){return'<div class="msg warn">'+esc(x)+'</div>'}).join("");
if(!r.errors.length&&r.out.length){
var all=E.core.concat(r.out),nums={};all.forEach(function(q){var p="tf-"+q.topic+"-",re=new RegExp("^"+p.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"(\\d+)$"),m=re.exec(q.id||"");if(m)nums[q.topic]=Math.max(nums[q.topic]||0,+m[1])});
r.out.forEach(function(q){var n=++nums[q.topic]|| (nums[q.topic]=1);q.id="tf-"+q.topic+"-"+String(n).padStart(3,"0")});
h+='<div class="msg ok">'+r.out.length+" stems / "+r.out.reduce(function(n,q){return n+q.items.length},0)+" statements ready. All imported stems are marked unverified.</div>";
h+="<h2>Preview</h2>"+r.out.slice(0,3).map(function(q){return'<div class="pv"><p class="label">'+esc(E.topics[q.topic])+" · "+esc(q.sub)+" · "+esc(q.id)+'</p><b>'+esc(q.q)+'</b><ol>'+q.items.map(function(x){return"<li>"+esc(x.text)+" — <b>"+(x.answer?"True":"False")+"</b><p>"+esc(x.explain)+"</p></li>"}).join("")+"</ol><small>References: "+q.references.map(esc).join(" · ")+"</small></div>"}).join("");
h+='<button class="btn primary" id="dl">Download tf-core-expansion.json</button><p class="hint">Upload to <code>data/questions/tf-core-expansion.json</code>. It is already registered in <code>data/manifest.json</code>, so no manifest change is needed. This checker checks format and duplicates; it does not verify medical accuracy or source support.</p>';
window._tfDownload=function(){download("tf-core-expansion.json",JSON.stringify({questions:all},null,2)+"\n")}
}else if(!r.errors.length)h+='<div class="msg warn">Nothing new to add.</div>';
$("out").innerHTML=h;var b=$("dl");if(b)b.onclick=window._tfDownload
}
$("go").onclick=function(){$("out").innerHTML="<p>Checking…</p>";ready.then(function(){show(check(parse($("inp").value)))}).catch(function(e){$("out").innerHTML='<div class="msg err">'+esc(e.message)+'</div>'})}
})();
</script></body></html>
